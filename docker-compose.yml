services:
  postgres:
    image: postgres:15-alpine
    container_name: railconnect-postgres
    environment:
      POSTGRES_DB: railconnectdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: railconnect-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
